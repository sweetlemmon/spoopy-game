    N("Her thumb finds the remote. Click. The white wire pulls tight through your neck, and every scream you have left folds into a wet, strangled gasp. Your jaw locks. Your tongue swells. The edges of the kitchen go white. “Not a sound,” she breathes, eyes shining, her mouth against your ear, her breath hot with tea. “I'll hold it down until he's gone. I'll hold it until you forget what a voice is for.” She leaves you slumped in the chair with spit on your chin, smooths her hair in the dark window, and opens the door the width of the chain.", { add: 2, fx: "glitch" }),
    N("Behind her, as if on cue, a television somewhere in the house shrieks: a woman's scream, a swell of violins. She must have switched it on before the first knock."),
    H("Oh, officer! I'm so sorry. It's Halloween, isn't it? I've been watching horror movies all evening with the volume up, and I'm afraid I got a little too into it. Would you like some candy? I always buy the full-size ones. I like to see the children's faces.", { speed: 14 }),
    O("Ha. Halloween. Right. No, I get it, miss. Half the street has been screaming since five o'clock. Sorry to bother you. Happy Halloween.", { alt: { lied: "Ha. Halloween. Right. No, I get it, miss. Half the street has been screaming since five o'clock. Come on, miss, let's get you home. Your friend is fine. Happy Halloween." } }),
    N("He believes her. Of course he does. It is Halloween night, and everyone is screaming, and she is smiling in her apron with a bowl of candy in one hand and the other behind the door, on a button that is trying to stop your heart. Every time you push at a sound, the wire bites, and what comes out is a wet click, a fish gaping on a dock. Five feet away a man in a uniform is laughing about children. It stays on exactly as long as he stands on the porch, and not a second longer. She wants you to understand that: it is not a punishment. It is a leash with a perfect length. When his boots go down the steps the white wire lets go, and you fall out of the chair onto the tile, gasping, retching, with no breath left to call him back."),
    N("Then the footsteps retreat for good, and a card slides through the mail slot and lands face up on the floor."),
    N("A police officer's name, a phone number, and on the back, in blue pen: Missing person report, filed five weeks ago. Your name underneath.", { alt: { lied: "A folded note slides through the mail slot, in handwriting you would know anywhere: I called the police. I am not leaving you in there. — ****" } }),
    N("She snatches the camera from the shelf. A flash. The polaroid slides out, and your face slowly emerges from the gray: mouth open, eyes wild, utterly raw. She pins it beside your name with trembling fingers."),
    H("Nobody misses you? Who told you that? I never said that, {pet}. You must have dreamed it. You dream so many things.", { speed: 44, add: 2, alt: { lied: "You told me you didn't care about her. And yet. Here she is on my porch, calling your name. Do you know what that means, {pet}? It means you lied to me. And people who lie to me teach me things about their families." } }),
    H("But oh, that face. Do you see it? That's the one I've waited my whole life for. And you gave it to them. To a stranger on my porch. Not to me.", { alt: { lied: "But oh, that face. Do you see it? That's the one I've waited my whole life for. And you gave it to her. To ****, on my porch. Not to me." } }),
    N("The syringe slides into the side of your neck while you are still staring at your own screaming face. The room drops away like a trapdoor."),
    N("You wake on the kitchen floor with a blanket tucked under your chin, your shirt buttoned wrong, the taste of her mouth still on yours. The house is silent. On the table, a chef's knife rests on a folded cloth beside the remote, and a note in red ink: Be good. Or don't. I want to see which."),
    N("The front door stands at the end of the hall. The third lock never clicked. Somewhere in the house, a floorboard creaks, or doesn't.", { choices: [
      { ...C("Run for the door.", "~You run, if it can be called running, down the hall and out into the night.", 3, 3), goto: "endC" },
      { ...C("Take the remote. Open the collar first.", "~You snatch the remote off the table with your good hand. Your thumb passes over the red button without pressing it, hunts across the others, and one of them makes the buckle at your throat click open. Real wire, real battery, a real weight in your hand. You never doubted it for a second.", 2, 1), goto: "hope2" }] }),
    N("The collar clatters across the tile. Your throat feels naked, and enormous. The knife waits on its cloth. The door waits at the end of the hall. You don't know how long you have.", { id: "hope2", choices: [
      { ...C("Leave the knife. Run.", "~You do not look back. You are through the door before you have finished deciding.", 3, 2), goto: "endD" },
      { ...C("Take the knife. Wait for her.", "~The handle is cold. You wait in the dark hallway with your back to the wall, listening for the sound of her key.", 3, 2), goto: "endL" }] }),

    N("The footsteps retreat down the porch. A card slides through the mail slot and lands face up on the floor.", { id: "dev1" }),
    N("A police officer's name, a phone number, and on the back, in blue pen: Missing person report, filed five weeks ago. Your name underneath.", { alt: { lied: "A folded note slides through the mail slot, in handwriting you would know anywhere: I called the police. I am not leaving you in there. — ****" } }),
    N("She stares at the empty polaroid on the corkboard for a long time, then at you. She does not raise the camera. Slowly, she lowers the syringe."),
    H("Nobody misses you? Who told you that? I never said that, {pet}. You must have dreamed it. You dream so many things.", { speed: 44, add: 2, alt: { lied: "You told me you didn't care about her. And yet. Here she is on my porch, calling your name. Do you know what that means, {pet}? It means you lied to me. And people who lie to me teach me things about their families." } }),
    H("But you didn't make a sound. You stayed. For me. Do you know what that did to me? I need to lie down. I need... no. First I need to show you something."),
    N("The kitchen is blindingly white. On the table lie a chef's knife on a folded cloth and, beside it, the remote."),
    H("I'm going out for a little while, to buy you something pretty. The knife is yours, if you want it.", { alt: { anything: "I'm going out for a little while, to buy you something pretty. The knife is yours, if you want it. You said you'd do anything for the ones you love, remember?" }, choices: [
      { ...C("Take the knife.", "~The handle is still warm from her hand. She watches your fingers close around it, and her pupils swell with something like worship. “There you are.”", 1, 0, { knife: true }), goto: "endB" },
      { ...C("Leave it on the table.", "~She looks almost disappointed. Then she laughs and kisses your cheek. “Next time.”", 1), goto: "dev2" }] }),
    N("She is gone for hours. You sit at the table with your hands folded, the knife untouched, the front door at the end of the hall. Then the key turns, and she comes in with a shopping bag and a camera hanging from her neck.", { id: "dev2" }),
    H("I bought you something pretty. A mirror."),
    N("She sets a small mirror on the table and turns it toward you. Your own face looks back, pale, bruised, hollow under the eyes.", { branch: [{ if: "claimedLove", goto: "loveCall" }], goto: "mirror" }),
    H("You told me you loved me once, {pet}, over a bowl of stew, with your heart skipping. I kept it anyway.", { id: "loveCall" }),
    H("Now take the mask off, {pet}. Whatever you've been wearing all these weeks. Whatever face you make when you're alone. Let me see it. Let me finally see it.", { id: "mirror", alt: { helped: "Now take the mask off, {pet}. You helped me up, that night on the kitchen floor. I haven't forgotten. Don't waste that on a mask.", abandoned: "Now take the mask off, {pet}. You didn't help me up that night on the kitchen floor. I haven't forgotten. Let me see it anyway." }, speed: 44, choices: [
      { ...C("Show her everything.", "~You stop holding it back. The terror, the grief, the hatred, and underneath, the thing you never wanted to name. Your face does it all by itself.", 1, 0, { raw: "+2" }), goto: "endS" },
      { ...C("Smile for her.", "~You smile, soft and sweet and exactly as wide as she likes. Her breath catches.", 1, 1, { fake: "+2" }), goto: "smile2" }] }),

    N("You scream. It tears out of you, raw and enormous, and the soundproofed walls throw it back at you unanswered.", { id: "endZ" }),
    H("Oh, {pet}. I told you. I'm not angry. I'm really not. I'm just so disappointed. This is how it always goes. I wake you up, I play with you, and then you pass away. I was so sure you'd be different."),
    N("Her hand clamps your jaw, and she feels impossibly strong, though you are so dizzy from the blow and so weak from the cold that a child could have held you. The blade is suddenly in your mouth, cold against your teeth. “Hold still.” You don't."),
    N("The first cut is a pop of white fire, and then there is only copper and the thick wet sound of your own screaming with nothing left to scream with. She holds the red, twitching meat up to the lamp, almost shy, like a girl showing off a pressed flower."),
    H("There. Now you'll never disappoint me again. Shh. Don't cry, it only makes you bleed faster. Look at me. Keep looking at me. Yes. Yes. There it is. That's the one."),
    N("You drown slowly. The blood fills your throat faster than your lungs can empty it. The last thing you see is her face, flushed and wet, the camera flashing once, twice, three times, her lips moving: mine, mine, mine."),
    N("She does not bury you. For a week she talks to you every night, brushing your hair, humming four notes, and your body learns to wait. Then the flies come. Then the smell. Then the soft, white, wriggling things that nest behind your lips and in the red hollow where your tongue used to be."),
    N("Your corpse lives in her basement now, with the maggots. She visits it every night with a lantern and fresh flowers, and she tells it everything. She tells it she loves it. The maggots tell it nothing at all.", { end: true }),

    N("You get as far as the porch. The collar chirps once against your throat, a tiny warning, and then the white wire pulls tight and your legs fold. You vomit onto the boards, shaking, every muscle singing with it.", { id: "endC" }),
    N("She stands in the doorway behind you with the remote in one hand and a hammer in the other. She must have been standing there the whole time."),
    H("Oh, {pet}. I told you it was one in ten. I never lie about the collar. I only had to press once, and you folded on my own porch."),
    H("Isn't that the most beautiful thing? I never had to lay a finger on you. And yet you ran. After all of that. So I'll have to be sure."),
    N("The first blow shatters your left ankle with a sound like a snapped branch. The second takes the right. You scream until your voice goes, and she kneels beside you, stroking your hair, crying, whispering I'm sorry, I'm sorry, I have to."),
    N("She cannot carry you. She hooks her hands under your arms and drags you back inside a few inches at a time, your ruined ankles flopping at angles no ankle should, every threshold a fresh white explosion, while she sobs and curses and slicks the boards with her sweat, stopping every few feet to press her wet face into your hair and whisper I'm sorry, I'm sorry, you made me, you made me. Past the kitchen, past the corkboard where your raw face hangs. The bones heal crooked. The collar was real all along, and it is not what keeps you here. Not after tonight."),
    N("Months later you still flinch when a buckle clicks, and every night, in the dark, the collar warms against your throat as if it were thinking of you. She hardly ever has to press the button now. Your body does the flinching all by itself.", { end: true }),

    N("You run. On two broken feet, one arm clamped against your chest around the splinted wrist, over wet grass, over gravel, over the black glass of the road, screaming into your teeth, until the lights of a gas station swell out of the dark and a stranger's startled face turns toward you, then goes to the bleeding heart carved into your forehead, and to the black ladder of stitches showing through your torn shirt, and she covers her mouth.", { id: "endD" }),
    N("Taped to the window, between a lottery poster and a flyer for a lost cat: your own face, and under it, five weeks of MISSING. Someone has drawn a small heart in the corner. Someone cared."),
    N("Police find the house at dawn. Every door stands open. The table is set for two. In the basement they find a pole, a drain, a mattress soaked brown. Down the hall, a corkboard of faces, some with names in red ink, some with tufts of hair still taped to the corners. Behind four locks, a room papered floor to ceiling with photographs of you, and across from it a woman on a narrow bed with a heart painted on her forehead."),
    N("They find no one. Not her, not the faces, not the bodies. Behind the house the rose garden is thick and dark, and fresh earth is heaped under every bush, and the roses have never looked so alive."),
    N("The officer from the porch is the one who tells you, in a voice that will not stay level, that the house belongs to a woman who vanished years ago. Her name is still on the deed. She had no children. No daughter, no records, nothing. Nobody can say who the girl with the knife is, or was, or where she came from."),
    N("Years later, when you have almost stopped checking the locks, you begin to hear someone humming four notes outside your window. **** lives on the fourth floor. Someone has taped a polaroid to her door: **** asleep, mouth open, taken from inside her bedroom.", { end: true }),

    N("The key turns at dusk. You get to your feet in the dark hallway, the knife held low in your good hand, the splinted wrist pressed against your chest, your bare throat strange and light without the collar, your heart pounding in your ears like a second set of footsteps.", { id: "endL" }),
    H("Oh, {pet}. Look at you, standing. And you kept it. You looked at that knife and you picked it up. Show me. Show me the face you made."),
    N("She steps closer with her arms open, the camera swinging against her chest, tears already shining. You step closer too. You embrace her. The knife goes in under her ribs with a wet, tearing push, and warm blood floods your knuckles, your wrist, your sleeve."),
    H("There. There. Oh, that face. That's the one. That's the one I've been looking for."),
    N("She sinks against you, laughing, choking, red bubbling at her lips, and lays trembling fingers on your cheek as if to memorize it. The camera slips from her hand. At your feet a polaroid slides out and begins to develop: your face, mouth open, utterly raw."),
    N("It takes her a long time to die. She does not stop smiling. You sit with her on the kitchen floor until the blood goes cold and sticky and her pupils stop answering the light."),
    N("You find the keys in her coat and open every door: the room papered with your own face, the narrow bed where a woman with a heart on her forehead has waited thirty years. Behind the corkboard, a trapdoor leads to a cellar where something long dead is still wearing a name tag. You never learn how many. You never stop counting. When the police finally come, the officer from the porch tells you the house belongs to a woman who vanished years ago. She had no children. There is no record that the girl ever existed.", { end: true }),

    N("The knife fits your good hand as though it grew there, and for the first time the splinted wrist stops throbbing. She watches you from the doorway with wet, shining eyes.", { id: "endB" }),
    H("You kept it. You looked at it, and you kept it. Oh, my love. My perfect, honest love. Tell me what you feel. Tell me everything."),
    N("What you feel is simple and terrible: warm, like a held breath finally let go. You tell her. She shakes with joy."),
    H("Tonight, then. Someone from the café, maybe, the one who always stared. Or ****. Family always comes looking, doesn't it?", { alt: { miraSafe: "Tonight, then. Someone from the café, maybe, the one who always stared. Not ****. I promise. You asked me so beautifully. Family stays. Everyone else, though..." } }),
    N("The night is cold and the street is empty. She slides her hand into yours, the knife in your other hand, and the two of you walk out together into the dark in matching steps, humming the same four notes."),
    N("The man from the café sees your face before the first blow and says your name, and the knife does not stop. He does not scream for long. You learn how heavy a person is, how warm the inside of one is, how blood steams in cold air, how the sound a body makes when it is opened is not a scream but a long, wet sigh. She photographs your face the whole time, laughing and crying and whispering mine, mine, mine, and kissing the wet red heart on your forehead between every blow, and you laugh too, your hands slick to the elbow, and it is the most alive you have ever felt.", { end: true }),

    N("She looks at your face for a very long time. She does not raise the camera. Her hands, which have not stopped trembling since the day you woke in her basement, go perfectly still.", { id: "endS" }),
    H("There. That's it. All of it. The fear, and the hate, and..."),
    N("She doesn't finish. She presses your hand to her mouth instead, and her eyes spill over. Then she reaches up and traces the heart on your forehead with her thumb, the way you would touch a rosary."),
    H("It isn't for me, is it? That face. You'll make it for strangers on my porch, for a mirror, for anyone but me. You will never make it for me. Not once. Not even now.", { speed: 44 }),
    N("She lays the camera on the table, the film still blank, and does not pick it up again. She does not come to bed that night. Down the hall the bathroom tap runs for a long time, and then stops. Somewhere in the dark something heavy slides down a wall, and you tell yourself it is the pipes. At some point you realize the humming has stopped, and that you cannot remember the last time it did."),
    N("In the morning there is no needle. No humming, no kettle, no smell of lavender. For the first time in weeks you wake with arms that are your own, light and strange and yours. The house is silent in a way it has never been silent, thick and listening, and on the air there is a smell you know from the basement, sweet and coppery. You walk to the kitchen on the sides of your feet, every step a white flash, one hand trailing along the wall."),
    N("She is on the kitchen tile in a dark, spreading puddle, one cheek in it, her sleeves black and heavy, the red still creeping across the grout toward your bare, broken feet. There is so much of it. The knife lies in the wet a hand's breadth from her fingers. The remote lies by her face. Her eyelids flutter, and she finds you standing over her, and the look she gives you is the smallest, loneliest, most naked thing you have ever seen: no smile, no mask, no performance. She is so pale. She is almost gone. Her thumb twitches toward the red button, and does not press. The collar at your throat is real. She could. She doesn't.", { fx: "glitch" }),
    H("You're walking. I forgot your dose. I forgot... Look at you. It's yours now, {pet}. All of it. Whatever you decide.", { speed: 55, choices: [
      C("Press a towel to her wounds.", "~You drag the dish towel from the oven door and kneel in the red, and it soaks through in seconds, warm and far too heavy. You press down with both hands, hard, your knees sliding in the slick, her pulse fluttering under your palms like a trapped moth. She stares at you as if you had spoken a language she has only ever read about.", 1),
      { ...C("Pick up the knife.", "~The handle is cold and sticky. She watches the blade rise, and she does not reach for the remote. She smiles, small and wet and grateful.", 3, 2), goto: "endK" },
      { ...C("Take the remote and walk out.", "~She lets you take it. Your thumb passes over the red button without pressing it, finds another, and the buckle at your throat clicks open. The collar clatters onto the tile, real and heavy. You stand. Your feet scream, and every step toward the door is a step through deep water. She does not move. She does not even breathe.", 2, 1), goto: "endF" }] }),
    N("On the corkboard, the blank polaroid has finally filled. It is not a scream. It is you, asleep, her head on your shoulder, both of you almost smiling. It is the only photograph in the room where anyone is happy."),
    N("You stay. Not because of the locks. Not because of the collar, which is real, and which she never presses again. Because somewhere along the way her cruelty and your wanting braided into one thing, and you can no longer find the end of either. The roses keep growing. In the basement, behind the pole, the earth never settles.", { end: true }),
    N("Her smile widens, and her eyes go bright and wide, as if you had finally looked up. She does not reach for the remote. She does not look away.", { id: "endK" }),
    H("There. That face. That's the one. You made it for me.", { speed: 50 }),
    N("You bring the knife down in your good hand. It takes less strength than you thought, and far more than you have. It goes in with a small, wet, almost polite sound, and her hand closes around your wrist, not to stop you but to hold on, and she keeps her eyes on your face the whole time, memorizing it, until the light goes out of them like a lamp at the end of a long night. The house goes quiet in a way it has never been quiet: no humming, no scraping, no footsteps on the stairs. At last you find the right button on the remote, and the buckle at your throat springs open, and the collar drops onto the tile beside her, real and heavy and useless now. Years later you still wake counting heartbeats in the dark, three, four, five, losing your place, starting over.", { end: true }),

    N("She searches your smile for a long time, frame by frame, for a flaw. She does not find one, and that frightens her more than any scream could have.", { id: "smile2", alt: { "fake:3": "She searches your smile for a long time, frame by frame, for a flaw. She does not find one. Then she opens the notebook beside her plate and turns the pages aloud, ticking each line with a small red stroke of her pen. “A lie. A lie. A lie. I kept count, {pet}.” The strokes pile up like tally marks on a cell wall.", "liesTold:3": "She searches your smile for a long time, frame by frame, for a flaw. She does not find one. Then she opens the notebook beside her plate and turns the pages aloud, ticking each line with a small red stroke of her pen. “You said you were happy. A lie. You said you were tired. A lie. You said you'd rather stay. A lie.” The strokes pile up like tally marks on a cell wall." } }),
    H("It's perfect. It's so perfect that I can't find the seam. And do you know what I thought, just now? I thought: I could keep this one. I could take this one out to dinner, and nobody would ever know. Or I could dig for the one underneath. Tell me which, {pet}. Tell me with your face.", { alt: { "fake:3": "I've asked you forty questions and you've given me forty different faces, and now this one, so perfect I can't find the seam. I could keep this one. I could take this one out to dinner, and nobody would ever know. Or I could dig for the one underneath. Tell me which, {pet}. Tell me with your face." }, choices: [
      { ...C("Keep smiling. (give in)", "~You keep smiling. The muscles in your cheeks burn. She watches you for a very long time, and then she starts to laugh, softly, with enormous relief.", 1), goto: "endP" },
      { ...C("Let the smile slip.", "~The smile cracks. For half a second the real face shows through, white and wet and ugly with terror, and her breath stops. Her thumb is already moving. You never see it. Click. The white wire seizes every muscle in your body, and the smile you were holding locks onto your face like a hook, a rictus you cannot drop, and above you she smiles, huge and radiant, and you understand you have made a terrible mistake.", 3, 2), goto: "endE" }] }),
    N("The collar holds you rigid in the chair, a statue with its eyes open. She does not raise the camera. She raises the knife. She is crying, and you cannot tell whether it is grief or joy, and neither can she.", { id: "endE" }),
    H("I'm going to find it, {pet}. The real one. It's in there. I'll look everywhere. I'll take my time."),
    N("She starts with the smile. She opens it wider with the tip of the blade, until the corners of your mouth meet your ears and your screams finally come out the right shape. She photographs each one. She whispers I'm sorry, I love you, I'm so sorry, I love you, and she keeps looking."),
    N("The polaroid on the corkboard stays blank for months. Then one day it isn't. You are no longer entirely there to see it. What still comes out of your mouth is mostly a wet, patient hum: four notes, over and over.", { end: true }),

    N("She sets the ring box down on the velvet very gently, as if it might wake.", { id: "endM" }),
    H("No. Of course. I knew. I always knew, really. Everyone says no in the end. Mother said no. She packed her bag and she said no."),
    H("Do you know what I learned? If I can't keep you, nobody can. If I can't have you, then there is no you left to be had. It's so simple. Why did it take me so long?", { speed: 44 }),
    N("Four locks turn behind you, one, two, three, four. You never heard her cross the room. The key on its ribbon is already around her neck, and in one hand she holds a bottle of something clear, and in the other, the knife."),
    N("She pours the clear liquid in a ring around the two of you, over the photographs, over the shelves, over the white dress, humming four notes. The room fills with a sharp, sweet smell. A match scrapes. Scrrraaape."),
    H("Hold me. Please. Look at me. I want it to be the last thing you see.", { speed: 50 }),
    N("The fire climbs the paper faces first, and each one blackens and curls and looks, for the first time, at her. The knife goes in under your ribs with her arms around you and her mouth against your neck, and you feel her laughing, crying, sobbing I love you into your skin as the room turns white. The last thing you hear is her voice, soft and delighted, counting your heartbeats, three, four, five, losing her place, and finally stopping.", { end: true }),

    N("The first lock gives under your hand. The second. The third. You are on the porch before you notice the cold. Behind you the door stays open, and the light from the hall lies across the boards in a long gold path, and nothing walks down it.", { id: "endF" }),
    N("You look back once. She is still on the kitchen tile where you left her, in the dark, cooling pool, turning her own matching ring round and round with her thumb, her face wet, her mouth shaping something that might be your name or might be Mother. She does not follow. She lifts one hand. She does not wave. She does not stop you."),
    H("Go on. You were always going to. I only wanted somebody to stay, one time. Just once.", { alt: { pitied: "Go on. You were always going to. You said sorry to me once, in the hall, about Mother. Nobody ever has. I'm going to keep that. Just that. Go." } }),
    N("They find you on the road at dawn, barefoot, bleeding, a red heart scabbing over on your forehead, one wrist splinted with a wooden spoon, a ladder of black stitches up your ribs that no hospital put there. You tell them everything. Not one of them believes the part about the door."),
    N("When the police reach the house there is no one: only a dried brown stain on the kitchen tile, a trail of it leading out the back door, the shrine, the corkboard, the narrow room. On the kitchen table, the notebook lies open, and the last page, in neat red ink, says: You left. You walked out. I let you. It was the only true thing I ever did. Beneath it is a drawing in crayon: two stick figures, far apart, under a yellow sun."),
    N("Years later you still sleep with the lights on. Some nights you hum four notes without knowing it. Some nights you could swear that someone hums them back.", { end: true }),

    N("It is a Saturday in spring. Sunlight, a café window, two cups on a small round table. You are sharing a slice of cake, and she is feeding you with her fork, and the girl at the next table whispers to her friend that you two are the cutest couple she has ever seen.", { id: "endP" }),
    N("Your forehead is hidden under a fringe, your crooked wrist under a long sleeve, the ladder of stitches under your shirt. Her hand rests on your knee under the table, and every few minutes it squeezes, once, hard, like a question, and you answer by smiling a little wider."),
    H("Smile. Good. Not so wide. Wider. There. Mmm. Perfect. Tell the waiter how lucky I am, {pet}. Say it loud. I want him to know.", { speed: 14 }),
    N("At the counter, the man who used to work here is gone. His apron still hangs on its hook. Nobody asks where he went. Nobody ever asks."),
    H("Tonight we'll go home and you'll tell me what you really thought of today. Don't worry. I won't hurt you. I'll just listen, and write it down, and keep every word.", { speed: 44 }),
    N("**** texted this morning. You wrote back that you're fine, that you're happy, that you love her. It took you six drafts to make it sound true. She'll believe you. Everyone always believes a perfect smile.", { end: true })
  ]
};
</script>

<script>
/* ======================= ENGINE (non serve toccarlo) ======================= */
const $ = id => document.getElementById(id), G = GAME, last = G.scenes.length - 1;
let S = { music: 0, mv: .5, sv: .8, cur: 0, btn: 0 }, idx = 0, state = { meter: G.meterStart || 0, res: 0, flags: {} }, hist = [], timer = null, full = '', track = -1, ac;
try { Object.assign(S, JSON.parse(localStorage.getItem('gothic-vn') || '{}')); } catch (e) {}
[['music', G.music], ['cur', G.cursors], ['btn', G.themes]].forEach(([k, a]) => { if (!(S[k] < a.length)) S[k] = 0; });

/* audio */
const bgm = new Audio(); bgm.loop = true;
const click = new Audio(G.clickSound || ''); let clickOK = !!G.clickSound; click.onerror = () => clickOK = false;
function beep() { try { ac = ac || new AudioContext(); const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = 'triangle'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(70, t + .2);
  g.gain.setValueAtTime(.4 * S.sv * (G.clickGain ?? .3), t); g.gain.exponentialRampToValueAtTime(.001, t + .25);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .25); } catch (e) {} }
function sfx() { if (!S.sv) return; if (!clickOK) return beep(); const a = click.cloneNode(); a.volume = Math.min(1, S.sv * (G.clickGain ?? .3)); a.play().catch(beep); }
const VO = {};
function voice(k) { if (!VO[k]) { const src = k ? (G.voices || {})[k] : G.typeSound, v = VO[k] = { ok: !!src };
  if (src) { v.a = new Audio(src); v.a.onerror = () => v.ok = false; } } return VO[k]; }
function tickSyn(nar, m = 1) { try { ac = ac || new AudioContext(); const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = nar ? 'triangle' : 'square';
  o.frequency.value = (nar ? 200 + Math.random() * 60 : 640 + Math.random() * 260) * (1 - .4 * lvl());
  g.gain.setValueAtTime((nar ? .2 : .085) * S.sv * m, t); g.gain.exponentialRampToValueAtTime(.0001, t + (nar ? .09 : .045));
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .1); } catch (e) {} }
function tick(k) { if (!S.sv) return; if ((k ? (G.voices || {})[k] : G.typeSound) === '') return;
  const m = k ? (G.voiceVolumes || {})[k] ?? .6 : G.typeVolume ?? 1, v = voice(k); if (!v.ok) return tickSyn(!k, m);
  const a = v.a.cloneNode(); a.volume = Math.min(1, S.sv * m); a.playbackRate = (.9 + Math.random() * .25) * (1 - .3 * lvl());
  a.play().catch(() => tickSyn(!k, m)); }
const gs = new Audio(G.glitchSound || ''); let gsOK = !!G.glitchSound; gs.onerror = () => gsOK = false;
function zapSyn() { try { ac = ac || new AudioContext(); const n = Math.floor(ac.sampleRate * .22), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (i % 400 < 120 ? 1 : .15) * (1 - i / n);
  const src = ac.createBufferSource(), g = ac.createGain(); src.buffer = buf; g.gain.value = .25 * S.sv; src.connect(g); g.connect(ac.destination); src.start(); } catch (e) {} }
function zap() { burst(1); if (!S.sv) return; if (!gsOK) return zapSyn(); const a = gs.cloneNode(); a.volume = Math.min(1, S.sv * .6); a.play().catch(zapSyn); }
function music() { const t = G.music[S.music];
  if (!t || !t.src) { bgm.pause(); track = -1; return; }
  if (track !== S.music) { bgm.src = t.src; track = S.music; }
  bgm.volume = S.mv * (G.musicGain ?? .35); bgm.play().catch(() => {}); }

/* black ribbon bow on the text box */
(function () { const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='160' height='80' viewBox='0 0 160 80'><g fill='#06030a' stroke='#8d78b8' stroke-width='1.6' stroke-linejoin='round'><path d='M74 38 48 74l14-5 7 7 14-38z'/><path d='M86 38l26 36-14-5-7 7-14-38z'/><path d='M80 33C58 8 18 6 13 28c-4 19 38 22 67 8z'/><path d='M80 33c22-25 62-27 67-5 4 19-38 22-67 8z'/><rect x='71' y='27' width='18' height='19' rx='6'/></g><path d='M26 23c14-7 30-5 44 4M134 23c-14-7-30-5-44 4' stroke='#fff' stroke-opacity='.2' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>`;
  document.documentElement.style.setProperty('--rb', `url("data:image/svg+xml,${encodeURIComponent(svg)}")`);
  const R = document.documentElement.style; R.setProperty('--rw', (G.ribbonWidth || 18) + 'cqw');
  if (G.ribbon) { const pi = new Image(); pi.onload = () => R.setProperty('--rb', `url("${G.ribbon}")`); pi.src = G.ribbon; } })();

/* look & settings */
function apply() {
  const c = G.cursors[S.cur] || {}, b = G.themes[S.btn] || G.themes[0], r = document.documentElement.style;
  document.body.style.cursor = c.svg ? `url("data:image/svg+xml,${encodeURIComponent(c.svg)}") ${c.hot || '16 16'}, auto`
    : c.src ? `url("${c.src}") ${c.hot || '0 0'}, auto` : 'auto';
  ['pn', 'tx', 'bd', 'bb', 'bf', 'hi', 'sh'].forEach(k => b[k] && r.setProperty('--' + k, b[k]));
  r.setProperty('--op', (G.boxOpacity ?? .92) * 100 + '%');
  bgm.volume = S.mv * (G.musicGain ?? .35);
  try { localStorage.setItem('gothic-vn', JSON.stringify(S)); } catch (e) {}
}
function fill(id, arr, k) { const s = $(id); arr.forEach((o, i) => s.add(new Option(o.name, i))); s.value = S[k];
  s.onchange = () => { S[k] = +s.value; apply(); if (k === 'music') music(); }; }
fill('sm', G.music, 'music'); fill('sc', G.cursors, 'cur'); fill('sb', G.themes, 'btn');
['mv', 'sv'].forEach(k => { const r = $(k); const bar = () => r.style.setProperty('--v', r.value * 100 + '%'); r.value = S[k]; bar(); r.oninput = () => { S[k] = +r.value; bar(); apply(); }; r.onchange = sfx; });

/* wallpaper + glitch */
const im = $('bg'), gr = $('gr'), gc = $('gc'), wall = $('wall'), rnd = Math.random;
mood();
im.onload = () => wall.style.visibility = 'visible'; im.onerror = () => wall.style.visibility = 'hidden';
function bg(s) { if (!s) { wall.style.visibility = 'hidden'; im.removeAttribute('src'); return; }
  if (im.getAttribute('src') !== s) { im.src = s; gr.src = s; gc.src = s; } }
function burst(L) {
  if (wall.style.visibility === 'visible') {
    [gr, gc].forEach((el, i) => { const y = rnd() * 75, h = 3 + rnd() * (16 + 20 * L);
      el.style.clipPath = `inset(${y}% 0 ${Math.max(0, 100 - y - h)}% 0)`;
      el.style.transform = `translateX(${(i ? 1 : -1) * (.4 + rnd() * 1.1) * (1 + 2 * L)}cqw)`; el.style.opacity = .7 + .25 * L; });
    im.style.transform = `translateX(${(rnd() - .5) * .8 * (1 + 3 * L)}cqw)`;
    setTimeout(() => { gr.style.opacity = 0; gc.style.opacity = 0; im.style.transform = ''; }, (80 + rnd() * 130) * (1 + L));
  } }
function glitch() { burst(lvl()); setTimeout(glitch, (1800 + rnd() * 5500) * (1 - .85 * lvl())); }
if (G.glitch && !matchMedia('(prefers-reduced-motion: reduce)').matches) glitch();

/* scenes */
function type(sp) { const ms = G.scenes[idx].speed ?? G.textSpeed; clearInterval(timer); timer = null; const el = $('txt');
  if (!ms) { el.textContent = full; done(); return; }
  let c = 0; el.textContent = '';
  timer = setInterval(() => { el.textContent = full.slice(0, ++c);
    if (full.slice(c - 4, c) === '****') zap();
    if (c % (G.typeEvery || 2) === 0 && /\S/.test(full[c - 1])) tick(sp);
    if (c >= full.length) { clearInterval(timer); timer = null; done(); } }, ms); }
(function expand() { const A = G.scenes; A.forEach((s, i) => { s.id = s.id || '_' + i; }); const out = [];
  A.forEach((s, i) => { out.push(s); (s.choices || []).forEach((c, j) => { if (!c.reply) return;
    const nar = c.reply[0] === '~', nx = c.goto != null ? c.goto : (A[i + 1] ? A[i + 1].id : null);
    const r = { id: `_r${i}_${j}`, text: nar ? c.reply.slice(1) : c.reply, goto: nx };
    if (!nar) r.speaker = 'Her'; if (nx == null) r.end = true; out.push(r); c.goto = r.id; }); });
  G.scenes = out; })();
const ids = {}; G.scenes.forEach((s, i) => { if (s.id) ids[s.id] = i; });
let segs = [{ t: '' }], si = 0, PR = {}; try { PR = JSON.parse(localStorage.getItem('fy-ch') || '{}'); } catch (e) {}
const CH = [], chAt = {};
(G.chapters || []).forEach(c => [].concat(c.at).forEach((a, k) => { const i = G.scenes.findIndex(s => (s.text || '').startsWith(a)); if (i < 0) return; chAt[i] = { n: c.n, a }; if (!k) CH.push({ ...c, i }); }));
function save(n, a) { PR[n] = { a, st: JSON.stringify(state) }; try { localStorage.setItem('fy-ch', JSON.stringify(PR)); } catch (e) {} }
/* narration boxes that contain her quoted speech are split: narrator / Her / narrator ... */
function split(t) { const o = []; let l = 0, m; const re = /“([^”]*)”/g,
  P = (x, h) => { x = x.trim(); if (/[a-z0-9]/i.test(x)) o.push(h ? { t: x.replace(/,$/, '.'), her: 1 } : { t: x[0].toUpperCase() + x.slice(1) }); };
  while ((m = re.exec(t))) { P(t.slice(l, m.index)); P(m[1], 1); l = re.lastIndex; } P(t.slice(l)); return o.length ? o : [{ t }]; }
function pick() { const b = $('cl'); b.innerHTML = ''; CH.forEach(c => { const e = document.createElement('button'); e.textContent = c.n; if (!PR[c.n] && c.n > 1) e.className = 'new'; e.onclick = () => startCh(c); b.appendChild(e); }); $('chap').hidden = false; }
function startCh(c) { const p = PR[c.n], d = c.def || {}; hist = [];
  state = p ? JSON.parse(p.st) : { meter: d.meter ?? (G.meterStart || 0), res: d.res || 0, flags: { ...(d.flags || {}) } };
  let i = p ? G.scenes.findIndex(s => (s.text || '').startsWith(p.a)) : -1; if (i < 0) i = c.i;
  $('chap').hidden = true; screen(true); mood(); go(i); music(); }
function lvl() { return Math.max(0, Math.min(1, state.meter / (G.meterMax || 10))); }
function mood() { document.documentElement.style.setProperty('--dim', (G.wallpaperBrightness ?? .5) * (1 - .55 * lvl())); }
function test(e) { const [f, n] = String(e).split(':'), v = state.flags[f]; return (typeof v === 'number' ? v : v ? 1 : 0) >= (n ? +n : 1); }
function visible(c) { return (!c.if || test(c.if)) && (!c.ifnot || !test(c.ifnot)); }
function hasChoices() { return (G.scenes[idx].choices || []).some(visible); }
function change(o) { if (o.res) state.res = (state.res || 0) + o.res; if (o.add) state.meter = Math.max(0, state.meter + o.add); if (o.set) for (const [k, v] of Object.entries(o.set)) state.flags[k] = typeof v === 'string' && /^[+-]\d+$/.test(v) ? (state.flags[k] || 0) + +v : v; }
function target(s) { if (s.end) return -1;
  for (const b of s.branch || []) if ((!b.if || test(b.if)) && (!b.ifnot || !test(b.ifnot)) && (b.min == null || state.meter >= b.min) && (b.max == null || state.meter <= b.max) && (b.rmin == null || state.res >= b.rmin) && (b.rmax == null || state.res <= b.rmax) && (!b.ge || Object.entries(b.ge).every(([k, v]) => (state.flags[k] || 0) >= v))) return ids[b.goto];
  return s.goto != null ? ids[s.goto] : idx + 1 < G.scenes.length ? idx + 1 : -1; }
function done() { if (si < segs.length - 1 || !hasChoices()) return; const box = $('choices'); box.innerHTML = '';
  G.scenes[idx].choices.filter(visible).forEach(c => { const b = document.createElement('button'); b.textContent = c.text; b.onclick = () => choose(c); box.appendChild(b); });
  box.hidden = false; $('next').hidden = true; }
function snap() { hist.push({ i: idx, st: JSON.stringify(state) }); }
function choose(c) { snap(); change(c); go(c.goto != null ? ids[c.goto] : idx + 1); }
function reset() { hist = []; state = { meter: G.meterStart || 0, res: 0, flags: {} }; mood(); }
function finish() { $('choices').hidden = true; $('endp').hidden = false; }
$('e2').onclick = () => { $('endp').hidden = true; reset(); screen(false); };
$('e1').onclick = () => { let k = hist.length - 1; while (k >= 0 && !(G.scenes[hist[k].i].choices || []).length) k--;
  if (k < 0) return $('e2').onclick(); const h = hist[k]; hist.length = k; state = JSON.parse(h.st); $('endp').hidden = true; mood(); go(h.i, true); };
function go(n, restore) { if (n == null || !G.scenes[n]) return finish();
  idx = n; const s = G.scenes[n]; if (!restore) { const c = chAt[n]; if (c) save(c.n, c.a); change(s); if (c) state.ch = c.n; } mood();
  full = s.text; for (const k in s.alt || {}) if (test(k)) full = s.alt[k];
  { const K = state.flags.kitty, P = state.flags.puppy; full = full.replace(/\{pet\}/g, K ? 'kitty' : P ? 'puppy' : 'darling').replace(/\{noise\}/g, K ? 'meow or purr' : 'bark or woof').replace(/\{cry\}/g, K ? 'Meow, meow. Purr for me.' : 'Woof, woof. Bark for me.'); }
  segs = s.speaker ? [{ t: full }] : split(full); si = 0;
  bg(s.bg || G.wallpaper); if (s.fx) burst(1); $('cnt').textContent = (state.ch ? 'Chapter ' + state.ch : '') + (G.debug ? ' obsession ' + state.meter : '');
  show(); }
function show() { const s = G.scenes[idx], g = segs[si], sp = g.her ? 'Her' : s.speaker || ''; full = g.t; $('who').textContent = sp; $('who').hidden = !sp;
  $('choices').hidden = true; $('next').hidden = false; $('back').disabled = !hist.length && !si;
  $('next').innerHTML = si === segs.length - 1 && target(s) === -1 ? 'The End' : 'Next &rsaquo;'; type(sp); }
function next() { if (timer) { clearInterval(timer); timer = null; $('txt').textContent = full; done(); return; }
  if (si < segs.length - 1) { si++; return show(); }
  if (hasChoices()) return; snap(); go(target(G.scenes[idx])); }
function back() { if (si > 0) { si--; return show(); } const h = hist.pop(); if (!h) return; state = JSON.parse(h.st); go(h.i, true); }
function screen(g) { $('title').hidden = g; $('game').hidden = !g; if (!g) bg(G.wallpaper); }

/* wiring */
document.title = G.title; $('gt').textContent = G.title; $('sub').textContent = G.subtitle; bg(G.wallpaper); apply();
$('start').onclick = pick; $('cb').onclick = () => $('chap').hidden = true;
$('opt').onclick = $('gear').onclick = () => $('set').hidden = false;
$('close').onclick = () => $('set').hidden = true;
$('next').onclick = next; $('back').onclick = back;
document.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { sfx(); b.blur(); } });
addEventListener('keydown', e => { const k = e.key; if (!$('endp').hidden) return;
  if (!$('set').hidden) { if (k === 'Escape') { sfx(); $('set').hidden = true; } return; }
  if ($('game').hidden) return;
  if (/^[1-4]$/.test(k) && !$('choices').hidden) { const c = G.scenes[idx].choices.filter(visible)[+k - 1]; if (c) { sfx(); choose(c); } return; }
  if (k === 'ArrowRight' || k === ' ' || k === 'Enter') { e.preventDefault(); sfx(); next(); }
  else if (k === 'ArrowLeft') { sfx(); back(); }
  else if (k === 'Escape') { $('set').hidden = false; } });
</script>
</body></html>
